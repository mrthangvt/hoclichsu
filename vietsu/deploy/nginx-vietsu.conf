# Mẫu cấu hình Nginx (aaPanel: Website → tên miền → Config file, dán phần location vào trong server{})
# Bật SSL (Let's Encrypt) trong aaPanel trước, rồi bật "Force HTTPS".

client_max_body_size 8m;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
gzip_min_length 1024;

# Tài nguyên tĩnh do Nginx phục vụ trực tiếp (nhanh hơn qua Python)
location /static/build/ { alias /www/wwwroot/vietsu/static/build/; expires 365d; add_header Cache-Control "public, immutable"; access_log off; }
location /static/fonts/ { alias /www/wwwroot/vietsu/static/fonts/; expires 365d; add_header Cache-Control "public, immutable"; access_log off; }
location /static/vendor/ { alias /www/wwwroot/vietsu/static/vendor/; expires 365d; access_log off; }

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}
