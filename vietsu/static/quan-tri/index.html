<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quản trị · Học Lịch Sử</title>
<link rel="icon" href="/static/favicon/favicon-32.png">
<link rel="stylesheet" href="/static/fonts/be-vietnam-pro.css">
<link rel="stylesheet" href="/static/quan-tri/quan-tri.css?v=6.0">
</head>
<body>
<div id="vao" class="vao" hidden>
  <form class="the-vao" id="formVao" autocomplete="on">
    <img src="/static/v53/logo-sang.webp" alt="Học Lịch Sử" class="logo-vao">
    <h1 id="vaoTieuDe">Đăng nhập quản trị</h1>
    <p class="phu" id="vaoPhu"></p>
    <div id="vaoKhoiTao" hidden>
      <label>Mã quản trị (dòng VIETSU_ADMIN_TOKEN trong file .env trên máy chủ)
        <input name="ma_quan_tri" type="password" autocomplete="off"></label>
      <label>Họ tên <input name="ten" autocomplete="name"></label>
    </div>
    <label>Email <input name="email" type="email" required autocomplete="username"></label>
    <label>Mật khẩu <input name="mat_khau" type="password" required autocomplete="current-password"></label>
    <div id="vaoNhapLai" hidden><label>Nhập lại mật khẩu <input name="mat_khau_2" type="password" autocomplete="new-password"></label>
      <p class="goi-y">Ít nhất 10 ký tự, có chữ hoa, chữ thường và số.</p></div>
    <p class="loi" id="vaoLoi" role="alert"></p>
    <button class="nut chinh" type="submit" id="vaoNut">Đăng nhập</button>
  </form>
</div>

<div id="khung" class="khung" hidden>
  <aside class="thanh-ben" id="thanhBen">
    <a class="thuong-hieu" href="/" target="_blank" title="Mở trang Học Lịch Sử"><img src="/static/v53/logo-chu-toi.webp" alt="Học Lịch Sử"><span>Quản trị</span></a>
    <nav id="menuQT">
      <a href="#tong-quan" data-m="tong-quan"><i>◧</i>Tổng quan</a>
      <p class="nhom">Nội dung trang</p>
      <a href="#menu" data-m="menu"><i>☰</i>Menu &amp; trang chủ</a>
      <a href="#trieu-dai" data-m="trieu-dai"><i>⏳</i>Triều đại · thời kỳ</a>
      <a href="#su-kien" data-m="su-kien"><i>✦</i>Sự kiện lịch sử</a>
      <a href="#hcm" data-m="hcm"><i>★</i>Chủ tịch Hồ Chí Minh</a>
      <a href="#nhan-vat" data-m="nhan-vat"><i>☺</i>Nhân vật lịch sử</a>
      <a href="#bai-sgk" data-m="bai-sgk"><i>▤</i>Sách giáo khoa</a>
      <p class="nhom">Hệ thống</p>
      <a href="#tai-khoan" data-m="tai-khoan" data-quyen="quan-tri"><i>⚿</i>Tài khoản</a>
      <a href="#nhat-ky" data-m="nhat-ky"><i>≡</i>Nhật ký</a>
      <a href="#cong-cu" data-m="cong-cu"><i>⚙</i>Công cụ khác</a>
    </nav>
    <div class="toi" id="toi"></div>
  </aside>
  <main class="noi-dung">
    <header class="dau"><button class="nut-menu" id="nutMenu" aria-label="Mở menu">☰</button><h2 id="tieuDe">Tổng quan</h2><span class="trang-thai" id="trangThai"></span></header>
    <section id="vung"></section>
  </main>
</div>
<div class="thong-bao" id="thongBao" role="status" aria-live="polite"></div>
<iframe id="khungGoc" title="Dữ liệu gốc" hidden></iframe>
<script src="/static/quan-tri/quan-tri.js?v=6.0"></script>
</body>
</html>
