<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Quản trị trang phục – Việt Sử V3.8</title><link rel="stylesheet" href="/static/fonts/be-vietnam-pro.css"><style>
:root{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#eee7d5;background:#10232a}*{box-sizing:border-box}body{margin:0;padding:24px;background:#10232a}header{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}h1{font-size:21px;margin:0 0 8px}p{line-height:1.65;color:#cbbda7}a{color:#e9c78b}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}label{display:flex;flex-direction:column;gap:7px;color:#eedfc2;font-weight:700;font-size:13px}input,textarea,select{border:1px solid #b38b55;background:#18343c;color:#f3eadc;border-radius:8px;padding:11px;font:inherit}textarea{min-height:90px}button{border:1px solid #c29a61;border-radius:9px;padding:10px 15px;background:#92683e;color:white;cursor:pointer;font:inherit}button:hover{background:#a77f4d}.panel{border:1px solid #577075;border-radius:16px;padding:20px;background:#163038;margin:18px 0}#viewer{display:flex;align-items:center;gap:20px;flex-wrap:wrap}#viewer img{width:150px;height:190px;object-fit:contain;background:#f2e8d4;border-radius:10px}small{color:#b7b8ad}#msg{padding:8px;min-height:26px;color:#e3bd7e}</style></head><body>
<header><div><h1>Kho trang phục lịch sử – V3.5</h1><p>Đổi từng biểu tượng trên Timeline. Quyền đăng tải tranh minh họa cần được xác minh.</p></div><a href="/admin">← Về quản trị nội dung</a></header>
<div class="panel"><div class="fields"><label>Mã quản trị<input id="token" type="password" placeholder="VIETSU_ADMIN_TOKEN"></label><label>Chọn biểu tượng<select id="which"></select></label></div></div>
<div class="panel"><div id="viewer"><img id="pic" alt="Ảnh hiện tại"><div><b id="caption"></b><p id="dates"></p><small id="source"></small></div></div><div class="fields"><label>Tên trang phục<input id="title"></label><label>Nguồn minh họa<input id="source_image"></label><label>Ghi công / quyền sử dụng<textarea id="credit"></textarea></label><label>Mô tả<textarea id="description"></textarea></label><label>Đổi ảnh từ máy (PNG/JPG/WebP, dưới 2,3MB)<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Hoặc URL ảnh HTTPS<input id="image_url" type="url" placeholder="https://..."></label></div><p><button onclick="save()">Lưu thay đổi</button></p><div id="msg"></div></div>
<script>
let data=[];const e=id=>document.getElementById(id);const selected=()=>data.find(x=>x.id===e('which').value);
function render(){const c=selected();if(!c)return;e('pic').src=c.image_url;e('caption').textContent=c.title;e('dates').textContent=`Giai đoạn ${c.start} – ${c.end} | ${c.periods.join(', ')}`;e('source').textContent=c.source_image;for(const k of ['title','credit','description','source_image'])e(k).value=c[k]||'';e('image_url').value='';e('file').value=''}
async function load(){try{const r=await fetch('/api/v3.5/costumes');if(!r.ok)throw new Error('Không tải được dữ liệu');data=await r.json();e('which').innerHTML=data.map(x=>`<option value="${String(x.id).replace(/[&<>"']/g,"")}">${String(x.title).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</option>`).join('');render()}catch(err){e('msg').textContent=err.message}}
async function save(){let c=selected();if(!c)return;let input={};for(const k of ['title','credit','description','source_image'])input[k]=e(k).value;input.image_url=e('image_url').value||null;let f=e('file').files[0];if(f){if(f.size>2300000){e('msg').textContent='Ảnh lớn hơn 2,3 MB';return}input.image_data=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)})}try{const r=await fetch('/api/v3.5/costumes/'+c.id,{method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Token':e('token').value},body:JSON.stringify(input)});const data=await r.json();if(!r.ok)throw new Error(data.detail||'Lỗi lưu');Object.assign(c,data);render();e('msg').textContent='Đã lưu trang phục. Tải lại website để xem phiên bản online.'}catch(err){e('msg').textContent=err.message}}
load();
</script></body></html>
