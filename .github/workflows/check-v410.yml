name: V4.10 – Kiểm tra nội dung và giữ khóa giao diện
on:
  push:
    branches:
      - gpt/v4.10-historical-source-enrichment
  pull_request:
    paths:
      - vietsu/static/v47-periods.json
      - vietsu/tools/check_v410_sources.py
      - .github/workflows/check-v410.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra hồ sơ sử liệu
        run: python3 vietsu/tools/check_v410_sources.py
      - name: Xác nhận không đổi thành phần giao diện
        run: |
          git diff --name-only HEAD^ HEAD | tee /tmp/v410-changed.txt
          if grep -E '^vietsu/(static/.*\.(html|css|js)|tools/build_v[0-9]+\.py)$' /tmp/v410-changed.txt; then
            echo "FAIL: V4.10 không được thay đổi HTML/CSS/JS/Builder."
            exit 1
          fi
