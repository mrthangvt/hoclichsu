# Tự đăng bản xem thử lên GitHub Pages mỗi khi có thay đổi trên nhánh main:
#   /                                  → giao diện Học Lịch Sử V5.9 (bản tĩnh, không có CMS/API)
#   /nhan-vat-lich-su/…, /chu-tich-ho-chi-minh/…, /sach-giao-khoa-lich-su/lop-6/… → trang chia sẻ từng mục (build_duong_dan.py)
#   /khong-gian/thanh-co-quang-tri/    → sa bàn 3D Thành cổ Quảng Trị
#   /khong-gian/dien-bien-phu/         → sa bàn 3D Điện Biên Phủ 1954
#   /khong-gian/ngoc-hoi-dong-da/      → sa bàn 3D Ngọc Hồi – Đống Đa 1789
#   /khong-gian/rach-gam-xoai-mut/     → sa bàn 3D Rạch Gầm – Xoài Mút 1785
# Bản đầy đủ (CMS, API, SGK) chạy bằng máy chủ Python: xem vietsu/HUONG_DAN_LOCAL_MAC.md.
# Bật một lần: Settings → Pages → Source: "GitHub Actions".
name: Deploy bản xem thử lên GitHub Pages
on:
  push:
    branches: [main]
    paths: ['vietsu/static/**', 'vietsu/tools/build_v42.py', 'vietsu/tools/build_v43.py', 'vietsu/tools/build_v44.py', 'vietsu/tools/build_v45.py', 'vietsu/tools/build_v46.py', 'vietsu/tools/build_v47.py', 'vietsu/tools/build_v48.py', 'vietsu/tools/build_v49.py', 'vietsu/tools/build_v411.py', 'vietsu/tools/check_v411_exam.py', 'vietsu/tools/check_v48_assets.py', 'vietsu/tools/build_v52.py', 'vietsu/static/v52.js', 'vietsu/static/v52.css', 'vietsu/tools/build_v53.py', 'vietsu/tools/build_v54.py', 'vietsu/tools/build_v55.py', 'vietsu/tools/build_v56.py', 'vietsu/tools/build_v57.py', 'vietsu/tools/build_v58.py', 'vietsu/tools/build_v59.py', 'vietsu/data/sgk_kntt_lop*.json', 'vietsu/data/v59_*.json', 'vietsu/data/duong_dan.json', 'vietsu/tools/build_duong_dan.py', 'vietsu/tools/fonts/**', 'vietsu/*.py', 'vietsu/requirements.txt', 'vietsu/Dockerfile', 'vietsu/.dockerignore', 'vietsu/data/**', 'tools/vps/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write   # đẩy bản dựng cho VPS lên nhánh ban-may-chu
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gom file tĩnh
        run: |
          python3 vietsu/tools/build_v59.py
          mkdir -p _site/static
          cp vietsu/static/Viet_Su_Timeline_V5.9_Offline.html _site/index.html
          cp vietsu/static/v42.css vietsu/static/v42.js vietsu/static/v43.css vietsu/static/v43.js vietsu/static/v44.js vietsu/static/v45.css vietsu/static/v45.js vietsu/static/v46.css vietsu/static/v46.js vietsu/static/v49-data.js vietsu/static/v49.js vietsu/static/v411.js vietsu/static/v52.css vietsu/static/v52.js vietsu/static/v53.css vietsu/static/v53.js vietsu/static/v54.css vietsu/static/v54.js vietsu/static/v55.css vietsu/static/v55.js vietsu/static/v56.css vietsu/static/v56-data.js vietsu/static/v56.js vietsu/static/v57.css vietsu/static/v57.js vietsu/static/v58.css vietsu/static/v58-sgk.js vietsu/static/v58.js vietsu/static/v59.css vietsu/static/v59-data.js vietsu/static/v59.js vietsu/static/v59-duong-dan.js _site/static/
          cp -r vietsu/static/avatar-v45 _site/static/avatar-v45
          cp -r vietsu/static/v43 _site/static/v43
          cp -r vietsu/static/v49 _site/static/v49
          cp -r vietsu/static/v53 _site/static/v53
          cp -r vietsu/static/v58 _site/static/v58
          cp -r vietsu/static/favicon _site/static/favicon
          cp vietsu/static/favicon/favicon.ico _site/favicon.ico
          cp -r vietsu/static/on-thi _site/on-thi
          cp -r vietsu/static/assets _site/assets
          cp -r vietsu/static/khong-gian _site/khong-gian
          touch _site/.nojekyll
      - name: Trang chia sẻ cho từng đường dẫn (ảnh 1200×630, Open Graph)
        # Khi có tên miền riêng: Settings → Secrets and variables → Actions → Variables → SITE_URL = https://hoclichsu.com
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://mrthangvt.github.io/hoclichsu' }}
        run: |
          python3 -m pip install --quiet pillow
          cp -r _site _vps
          python3 vietsu/tools/build_duong_dan.py _site
          SITE_URL=https://hoclichsu.com python3 vietsu/tools/build_duong_dan.py _vps
      - name: Bản cho VPS hoclichsu.com (nhánh ban-may-chu, aaPanel tự tải về — xem docs/VPS_AAPANEL.md)
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/vps-index"
          git --git-dir="$PWD/.git" --work-tree="$PWD/_vps" -C _vps add -A -f .
          cay=$(git write-tree)
          cm=$(git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit-tree "$cay" -m "Bản dựng cho hoclichsu.com từ ${GITHUB_SHA::7}")
          git push -f origin "$cm:refs/heads/ban-may-chu"
          rm -rf _vps
      - name: Mã máy chủ CMS cho VPS (nhánh ban-may-chu-api, container Docker hoclichsu-api)
        run: |
          mkdir -p _api
          rsync -a --exclude-from=vietsu/.dockerignore --exclude=.dockerignore vietsu/ _api/
          cp vietsu/.dockerignore tools/vps/docker-compose.yml tools/vps/cap_nhat_hoclichsu.sh _api/
          export GIT_INDEX_FILE="$RUNNER_TEMP/api-index"
          git --git-dir="$PWD/.git" --work-tree="$PWD/_api" -C _api add -A -f .
          cay=$(git write-tree)
          cm=$(git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit-tree "$cay" -m "Máy chủ CMS cho hoclichsu.com từ ${GITHUB_SHA::7}")
          git push -f origin "$cm:refs/heads/ban-may-chu-api"
          rm -rf _api
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
