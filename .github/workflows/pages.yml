# Tự đăng bản xem thử lên GitHub Pages mỗi khi có thay đổi trên nhánh main:
#   /                                  → giao diện Việt Sử V5.2 (kế thừa V4.11) (bản tĩnh, không có CMS/API)
#   /khong-gian/thanh-co-quang-tri/    → sa bàn 3D Thành cổ Quảng Trị
#   /khong-gian/dien-bien-phu/         → sa bàn 3D Điện Biên Phủ 1954
#   /khong-gian/ngoc-hoi-dong-da/      → sa bàn 3D Ngọc Hồi – Đống Đa 1789
#   /khong-gian/rach-gam-xoai-mut/     → sa bàn 3D Rạch Gầm – Xoài Mút 1785
# Bản đầy đủ (CMS, API, SGK) chạy bằng máy chủ Python: xem vietsu/HUONG_DAN_LOCAL_MAC.md.
# Bật một lần: Settings → Pages → Source: "GitHub Actions".
name: Deploy bản xem thử lên GitHub Pages
on:
  push:
    branches: [main]
    paths: ['vietsu/static/**', 'vietsu/tools/build_v42.py', 'vietsu/tools/build_v43.py', 'vietsu/tools/build_v44.py', 'vietsu/tools/build_v45.py', 'vietsu/tools/build_v46.py', 'vietsu/tools/build_v47.py', 'vietsu/tools/build_v48.py', 'vietsu/tools/build_v49.py', 'vietsu/tools/build_v411.py', 'vietsu/tools/check_v411_exam.py', 'vietsu/tools/check_v48_assets.py', 'vietsu/tools/build_v52.py', 'vietsu/static/v52.js', 'vietsu/static/v52.css', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gom file tĩnh
        run: |
          python3 vietsu/tools/build_v52.py
          mkdir -p _site/static
          cp vietsu/static/Viet_Su_Timeline_V5.2_Offline.html _site/index.html
          cp vietsu/static/v42.css vietsu/static/v42.js vietsu/static/v43.css vietsu/static/v43.js vietsu/static/v44.js vietsu/static/v45.css vietsu/static/v45.js vietsu/static/v46.css vietsu/static/v46.js vietsu/static/v49-data.js vietsu/static/v49.js vietsu/static/v411.js vietsu/static/v52.css vietsu/static/v52.js _site/static/
          cp -r vietsu/static/avatar-v45 _site/static/avatar-v45
          cp -r vietsu/static/v43 _site/static/v43
          cp -r vietsu/static/v49 _site/static/v49
          cp -r vietsu/static/on-thi _site/on-thi
          cp -r vietsu/static/assets _site/assets
          cp -r vietsu/static/khong-gian _site/khong-gian
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
