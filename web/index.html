<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thành cổ Quảng Trị 1972</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<!--ASSETS-->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<canvas id="c" tabindex="0" aria-label="Không gian 3D Thành cổ Quảng Trị 1972"></canvas>
<div id="labels"></div>
<div id="cross" hidden></div>
<div id="joy" hidden><span></span></div>

<div id="load"><div class="box"><div class="title"><div class="eyebrow">Không gian lịch sử</div><h1>Thành cổ Quảng Trị 1972</h1></div>
<div class="track"><div class="fill" id="fill"></div></div><small id="loadtxt">Đang tải mô hình…</small></div></div>

<div class="hud top">
  <div class="card title">
    <div class="eyebrow">Không gian lịch sử · Việt Sử</div>
    <h1>Thành cổ Quảng Trị 1972</h1>
    <p>Sa bàn mô phỏng · kịch bản: QĐND vượt sông đánh vào thành</p>
    <span class="tag">Tái dựng mô phỏng</span>
  </div>
  <div class="tools">
    <button class="chip" id="walk" aria-pressed="false">🚶 Đi bộ</button>
    <button class="chip on" id="lbtn" aria-pressed="true">Chú thích</button>
    <button class="chip" id="snd" aria-pressed="false">🔇 Âm thanh</button>
    <button class="chip" id="pause" aria-pressed="false">⏸</button>
  </div>
</div>

<div class="card" id="info" hidden><button class="x" id="infox" aria-label="Đóng">×</button><div id="infobody"></div></div>

<div class="hud bottom">
  <div class="views" id="views">
    <button data-v="all" class="on">Toàn cảnh</button>
    <button data-v="gate">Cổng Tiền</button>
    <button data-v="inside">Trong thành</button>
    <button data-v="trench">Mũi tấn công QĐND</button>
    <button data-v="river">Bơi vượt sông</button>
    <button data-v="boat">Thuyền vào thành</button>
    <button data-v="towers">Tháp sắt</button>
    <button data-v="arvn">VNCH cố thủ</button>
    <button data-v="tank">Xe tăng</button>
  </div>
  <div class="help" id="help">Kéo để xoay · cuộn/chụm để phóng to · chạm chú thích để đọc tư liệu</div>
</div>
<script type="module" src="js/app.js"></script>
</body></html>
