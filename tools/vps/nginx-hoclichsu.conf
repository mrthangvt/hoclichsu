    # ===== Học Lịch Sử: CMS /admin + API (container hoclichsu-api, 127.0.0.1:8010) =====
    # Dán khối này vào aaPanel → Website → hoclichsu.com → Config, ngay TRÊN dòng "#ERROR-PAGE-START".
    # ^~ để các luật ảnh/js/css mặc định của aaPanel không chặn mất đường dẫn của CMS.
    location ^~ /api/       { try_files /.hls-api @hls_api; }
    location ^~ /admin      { try_files /.hls-api @hls_api; }
    location ^~ /media/     { try_files /.hls-api @hls_api; }
    location ^~ /bai-viet/  { try_files /.hls-api @hls_api; }
    location ^~ /nhan-vat/  { try_files /.hls-api @hls_api; }
    location = /ads.txt     { try_files /.hls-api @hls_api; }
    # File tĩnh của trang lấy từ thư mục web; file của CMS (ảnh tải lên, giao diện admin) lấy từ container.
    location ^~ /static/    { expires 12h; try_files $uri @hls_api; }
    location @hls_api {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # ===== hết khối Học Lịch Sử =====
