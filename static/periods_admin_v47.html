<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Học Lịch Sử V4.7 – Biên tập triều đại</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1c24;color:#f0e6d7;font:14px/1.6 system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:28px}h1{color:#eac38c}nav{margin-bottom:22px}a{color:#f1c989}article{background:#152e37;border:1px solid #4a6569;padding:23px;border-radius:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:600;margin:9px 0 4px}input,select,textarea{width:100%;background:#09212b;color:#f2efea;border:1px solid #637b7a;border-radius:8px;padding:10px;font:inherit}textarea{height:240px;resize:vertical}button{padding:11px 17px;margin-top:12px;border-radius:9px;background:#e9c98e;color:#23322e;font-weight:bold;border:0;cursor:pointer}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.hint{color:#b8cac5}#log{white-space:pre-wrap;color:#e9d6ae}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:14px}}
</style></head><body><main><nav><a href="/admin">← Quay lại CMS</a> · <a href="/">Xem trang chủ</a></nav><h1>Hồ sơ thời đại / triều đại – V4.7</h1><p class="hint">Biên tập 19 giai đoạn × 13 chuyên mục. Chỉ mục đã duyệt và ghi nguồn mới được công bố; bản nháp được lưu riêng.</p><article><label>Mã quản trị</label><input id="token" type="password" autocomplete="off" placeholder="Mã đã tạo trong .env"><button id="load">Tải hồ sơ</button><div class="grid"><div><label>Thời đại</label><select id="period"></select></div><div><label>Chuyên mục</label><select id="category"></select></div></div><label>Nội dung</label><textarea id="content" placeholder="Viết nội dung kèm chú giải nguồn và mốc niên đại..."></textarea><div class="grid"><div><label>Tên nguồn tư liệu</label><input id="sourceTitle" maxlength="280"></div><div><label>Đường dẫn nguồn HTTPS (nếu có)</label><input id="sourceUrl" maxlength="1200"></div></div><label class="check"><input id="approved" type="checkbox"> Đã thẩm định và cho phép công bố</label><button id="save">Lưu nội dung</button><p id="log" role="status"></p></article></main><script>
let data=null;const $=id=>document.getElementById(id);const msg=s=>$('log').textContent=s;
async function req(url,opts={}){const res=await fetch(url,{...opts,headers:{'X-Admin-Token':$('token').value,'Content-Type':'application/json'}});let out={};try{out=await res.json()}catch(_){ }if(!res.ok)throw Error(out.detail||'Lỗi HTTP '+res.status);return out;}
function current(){const id=$('period').value,c=$('category').value;const p=data.public.periods.find(x=>x.id===id);const o=data.overrides[id]?.[c];$('content').value=o?.content||p?.sections?.[c]||'';$('sourceTitle').value=o?.source_title||p?.sources?.[0]?.title||'';$('sourceUrl').value=o?.source_url||p?.sources?.[0]?.url||'';$('approved').checked=o?.approved===true;msg(o?'Đang xem dữ liệu biên tập đã lưu.':'Đang xem dữ liệu mặc định của hồ sơ.');}
$('load').onclick=async()=>{try{data=await req('/api/v4.7/period-admin');$('period').replaceChildren(...data.public.periods.map(x=>new Option(x.name,x.id)));$('category').replaceChildren(...data.public.categories.map(x=>new Option(x.title,x.id)));current();}catch(e){msg(e.message)}};
$('period').onchange=current;$('category').onchange=current;
$('save').onclick=async()=>{try{const id=$('period').value,c=$('category').value;if(!data)throw Error('Vui lòng tải hồ sơ trước.');const payload={category:c,content:$('content').value,source_title:$('sourceTitle').value,source_url:$('sourceUrl').value,approved:$('approved').checked};const r=await req('/api/v4.7/periods/'+id,{method:'PUT',body:JSON.stringify(payload)});data.overrides[id] ||= {};data.overrides[id][c] = payload;msg('Đã lưu '+id+' / '+c+(r.approved?' — đã duyệt xuất bản':' — bản nháp, chưa công khai'));}catch(e){msg('Không lưu được: '+e.message)}};
</script></body></html>
